# Configuracion exclusiva de los tests (perfil "test").
# La aplicacion normal sigue usando MySQL/MariaDB y Flyway sin cambios.

spring.datasource.url=jdbc:h2:mem:tienda_gamer_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se genera desde las entidades JPA; las migraciones de MySQL no se aplican aca.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
# Igual que en produccion: mantiene la sesion abierta al serializar Pedidos con detalles lazy.
spring.jpa.open-in-view=true

# Valores que JwtServicio necesita (no tienen default en el codigo).
app.jwt.secreta=CLAVE-DE-PRUEBA-SOLO-TEST-NIVELUP-GAMER-2026-1234567890
app.jwt.vigenteza=28800000
app.frontend.url=http://localhost:5173
