# Perfil MariaDB: base de datos local "tienda_gamer" creada automaticamente
# Correr asi: java -jar productos.jar --spring.profiles.active=mariadb
spring.datasource.url=jdbc:mariadb://localhost:3306/tienda_gamer?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
