spring.application.name=productos
server.port=8080

# Perfil por defecto de la base de datos: mysql (cambiar a "mariadb" si corresponde)
spring.profiles.default=mariadb

# Clave secreta para firmar los tokens JWT (secreta compartida)
app.jwt.secreta=CAMBIAR-ESTA-CLAVE-SUPER-SECRETA-DEMINIMUM-40-CARACTERES-NIVELUP-GAMER-2026
# Vigencia del token en milisegundos (8 horas)
app.jwt.vigenteza=28800000

springdoc.swagger-ui.path=/swagger-ui.html
