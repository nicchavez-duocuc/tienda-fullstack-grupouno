# Perfil MariaDB (opcional, si Laragon usa MariaDB en vez de MySQL).
# Correr asi: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mariadb
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tienda_gamer?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
