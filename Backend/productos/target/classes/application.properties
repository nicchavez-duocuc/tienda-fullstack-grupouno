spring.application.name=productos
server.port=8080

# Perfil por defecto de la base de datos: mysql (Laragon trae MySQL 8 por defecto).
# Si usas la version MariaDB de Laragon puedes arrancar con:
#   mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mariadb
spring.profiles.default=mysql

# Permite llamar a la API desde el frontend servido por Vite (npm run dev / preview)
app.frontend.url=http://localhost:5173

# Clave secreta para firmar los tokens JWT (secreta compartida)
app.jwt.secreta=CAMBIAR-ESTA-CLAVE-SUPER-SECRETA-DEMINIMUM-40-CARACTERES-NIVELUP-GAMER-2026
# Vigencia del token en milisegundos (8 horas)
app.jwt.vigenteza=28800000

springdoc.swagger-ui.path=/swagger-ui.html
