# Perfil MySQL (Laragon): base de datos local "tienda_gamer" creada automaticamente.
# Laragon trae MySQL con el usuario root SIN clave por defecto. Si le pusiste una
# clave, escribela en DB_PASSWORD o directamente en spring.datasource.password.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_gamer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
