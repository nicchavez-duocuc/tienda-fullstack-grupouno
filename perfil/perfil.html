<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Perfil - Comunidad Gamer</title>
        <link rel="stylesheet" href="estilos_perfil.css">
    </head>
    <body>
        <header>
            <h1>Bienvenido Comunidad Gamer</h1>
        </header>
        <main>
            <section class="profile-container">
                <span class="sutitle">Ajustes de Usuario</span>
                <h2>Editar Perfil</h2>

                <!-- ID corregido sin espacio al final -->
                <form id="profile-form">
                    <div class="profile-avatar-container">
                        <img id="avatar-preview" src="https://ui-avatars.com/api/?name=Gamer&background=1E90FF&color=fff" alt="Foto de Perfil" onclick="document.getElementById('avatar-input').click();">
                        <span class="btn-avatar" onclick="document.getElementById('avatar-input').click();">CAMBIAR FOTO</span>
                        <input type="file" id="avatar-input" accept="image/*" style="display: none;">
                    </div>
                    <div class="input-group">
                        <label for="apodo">Apodo</label>
                        <input type="text" id="apodo" name="apodo" placeholder="tu apodo Gamer" required>
                    </div>
                    <div class="input-group">
                        <h2>¿Quieres cambiar tu clave?</h2>
                        <label for="clave-anterior">Clave actual</label>
                        <input type="password" id="clave-anterior" name="clave-anterior" placeholder="*******">
                    </div>
                    <div class="input-group">
                        <label for="clave-nueva">Nueva Clave</label>
                        <input type="password" id="clave-nueva" name="clave-nueva" placeholder="******">
                    </div>
                    <button type="submit" id="btn-guardar">Guardar Cambios</button>
                </form>

                <div class="navigation-link">
                    <a href="../visualizacion_productos/index.html" id="link-volver">&larr; Volver a la Tienda</a>
                </div>
            </section>
        </main>
        <script src="../Login/usuarios.js"></script>
    </body>
</html>
