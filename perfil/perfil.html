<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Perfil - Comunidad Gamer</title>
        <link rel="stylesheet" href="../general.css">
        <link rel="stylesheet" href="estilos_perfil.css">
    </head>
    <body>
        <!--
            Toda la página la dibuja React (src/main.jsx): el título de arriba, la
            tarjeta con la foto, el formulario y el enlace "Volver a la Tienda".
            Antes todo eso estaba escrito acá a mano; ahora este HTML es solo la
            cáscara. usuarios.js ya no se usa.

            style="display: contents" hace que este div no cuente como una caja:
            así el título y la tarjeta siguen siendo hijos directos del body y
            el CSS que los centra (body { display: flex }) funciona igual que antes.
        -->
        <div id="react-perfil-root" style="display: contents"></div>

        <script type="module" src="./src/main.jsx"></script>
    </body>
</html>
