</head>
<body>
    <header>
		<div class="cabeza">
			<h1 class="titulo">LEVEL-UP GAMER</h1>

	<header>
    <main>
        <p>Bienvenido a la comunidad Gamer</p>
        <section class="login-container">
            <h2>Inicio Secion</h2>

            <form class="login-form">
                <div class="input-group">
                    <label for="Gmail">Correo</label>
                    <input
                        type="Gmail"
                        id="Gmail"
                        name="Gmail"
                        placeholder="tucorreo@gmail.com"
                        required
                    >
                </div>
                
                <div class="input-group">
                    <label for="Contraseña">Clave</label>
                    <input
                        type="Contraseña"
                        id="Contraseña"
                        name="Contraseña"
                        placeholder="*********"
                        required
                    >


                </div>

                <button type="submit" id="btn-submit">Iniciar Sesion</button>

            </form>

            <div class="register-link">
                <a href="registrar.html" id="link-crear-cuenta">Crear Cuenta &rarr;</a>
            </div>
        </section>
    </main>
