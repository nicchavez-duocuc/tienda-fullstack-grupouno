<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Comunidad Gamer</title>

</head>
<body>
    <header>
        <h1>Bienvenido a la Comunidad Gamer</h1>

    </header>
    <main>
        <section class="register-container">
            <span class="subtitle">Registro Completo</span>
            <h2>Crear Cuenta</h2>

            <form id="register-form">
                <div class="register-form">
                    <label for="nombre ">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder=" juan Pablo"
                        required
                        >
                </div>
                <div class="register-form">
                    <label for="apellido">Apellido</label>
                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Perez"
                        >
                </div>
                <div class="register-form">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                        >
                </div>
                <div class="register-form">
                    <label for="Gmail">Gmail</label>
                    <input
                        type="email"
                        id="Gmail"
                        name="Gmail"
                        placeholder="juan_pablo@gmail.com"
                        required
                        
                    >
                </div>
                <div class="register-form">
                    <label for="Contraseña">Crear Contraseña</label>
                    <input
                        type="text"
                        id="contraseña"
                        name="contaseña"
                        placeholder="********"
                        required
                        >

                </div>
                <button type="submit" id="btn-registrar">Crear Cuenta</button>

            </form>
            <div class="login-link">
                <a href="Inicio_Sesion.html" id="link-login">&larr; Volver al Inicio Sesion</a>
            </div>
        </section>
    </main>
</body>
</html>
