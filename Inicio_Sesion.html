<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=derive-width,initial-scale=1.0">
    <title> Inicio Sesion - Comunidad Gamer</title>

</head>
<body>
    <header>Bienvenido a la comunidad Gamer</header>

    <main>
        <section class="login-container">
            <h2>Inicio Secion</h2>

            <form id="login-form">
                <div class="input-group">
                    <label for="Gmail">Gmail</label>
                    <input
                        type="Gmail"
                        id="Gmail"
                        name="Gmail"
                        placeholder="tucorreo@gmail.com"
                        required
                    >
                </div>
                
                <div class="inpit-grou">
                    <label for="Contraseña">Contraseña</label>
                    <input
                        type="Contraseña"
                        id="Contraseña"
                        name="Contraseña"
                        placeholder="*********"
                        required
                    >


                </div>

                <button type="submit" id="btn-submit">Iniciar Sesion</button>

            </form>

            <div class="register-link">
                <a href="registrar.html" id="link-crear-cuenta">Crear Cuenta &rarr;</a>
            </div>
        </section>
    </main>
</body>
</html>
