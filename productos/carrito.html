<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL-UP GAMER | Carrito</title>
    <link rel="stylesheet" href="carrito_style.css">
    <link rel="stylesheet" href="../header/style.css">
</head>
<body>
	<header>
		<div class="cabeza">
			<h1 class="titulo">LEVEL-UP GAMER</h1>
			<p class="botones"><a href="productos.html" target="_blank">Home</a> │ <a href="productos.html" target="_blank">Productos</a> │ <a href="https://www.w3.org/" target="_blank">Nosotros</a> │ <a href="https://www.w3.org/" target="_blank">Blogs</a> │ <a href="https://www.w3.org/" target="_blank">Contacto</a></p>
			<p class="cart"><a href="productos.html">Volver a la tienda</a></p>
		</div>
	</header>

    <main>
        <section class="cart-section">
            <h2>Tu Carrito de Compras 🛒</h2>
            
            <div id="cart-container">
                <!-- Los productos se inyectarán aquí mediante JS -->
            </div>
            
            <div class="cart-summary">
                <h3>Total a pagar: $<span id="cart-total">0</span></h3>
                <button id="btn-vaciar-cart" class="btn-vaciar">Vaciar Carrito</button>
                <button class="btn-pagar" onclick="alert('¡Gracias por tu compra en LEVEL-UP GAMER!')">Proceder al Pago</button>
            </div>
        </section>
    </main>

    <script src="js/carrito.js"></script>
</body>
</html>
